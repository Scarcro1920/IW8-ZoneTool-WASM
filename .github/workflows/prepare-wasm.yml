
name: Prepare IW8 ZoneTool

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Extract ZoneTool ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -type f | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: IW8-ZoneTool-Source
          path: extracted/
